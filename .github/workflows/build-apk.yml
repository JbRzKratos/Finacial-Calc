name: Build FinCalc Pro APK

on:
  push:
    branches: [main]
  workflow_dispatch:

env:
  JAVA_VERSION: 17
  NODE_VERSION: 20
  ANDROID_SDK_VERSION: 34
  BUILD_TOOLS_VERSION: 34.0.0

jobs:
  build:
    name: Build & Sign APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Java ${{ env.JAVA_VERSION }}
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: ${{ env.JAVA_VERSION }}

      - name: Setup Node ${{ env.NODE_VERSION }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3
        with:
          api-level: ${{ env.ANDROID_SDK_VERSION }}
          build-tools-version: ${{ env.BUILD_TOOLS_VERSION }}
          ndk-version: none

      - name: Install dependencies
        run: npm ci

      - name: Build web assets (Vite)
        run: npm run build

      - name: Sync Capacitor
        run: npx cap sync android

      - name: Decode keystore
        run: echo "${{ secrets.KEYSTORE_BASE64 }}" | base64 --decode > android/fincalc-pro.keystore

      - name: Write keystore.properties
        run: |
          cat > android/keystore.properties <<- EOF
          storeFile=../fincalc-pro.keystore
          storePassword=${{ secrets.KEYSTORE_PASSWORD }}
          keyAlias=${{ secrets.KEY_ALIAS }}
          keyPassword=${{ secrets.KEY_PASSWORD }}
          EOF

      - name: Build release APK
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleRelease
          cd ..

      - name: Rename APK for upload
        run: |
          cp android/app/build/outputs/apk/release/app-release.apk \
             android/app/build/outputs/apk/release/fincalc-pro.apk

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: fincalc-pro-apk
          path: android/app/build/outputs/apk/release/fincalc-pro.apk
          if-no-files-found: error
          retention-days: 30

      - name: Upload universal APK
        uses: actions/upload-artifact@v4
        with:
          name: fincalc-pro-universal-apk
          path: android/app/build/outputs/apk/release/app-release.apk
          if-no-files-found: error
          retention-days: 30

      - name: Upload ABI-split APKs
        uses: actions/upload-artifact@v4
        with:
          name: fincalc-pro-abi-split-apks
          path: |
            android/app/build/outputs/apk/release/app-arm64-v8a-release.apk
            android/app/build/outputs/apk/release/app-x86_64-release.apk
          if-no-files-found: warn
          retention-days: 30
